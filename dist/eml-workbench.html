<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>EML 计算台</title>
  <style>
:root {
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  color: #18212f;
  background: #eef2f4;
  font-synthesis: none;
  letter-spacing: 0;
  --paper: #ffffff;
  --line: #cbd4d9;
  --line-strong: #8d9aa2;
  --muted: #66737c;
  --accent: #087e8b;
  --accent-dark: #075f68;
  --accent-soft: #e5f4f5;
  --result: #166534;
  --result-soft: #edf8ef;
  --danger: #a63d40;
  --danger-soft: #fff1f1;
  --warm: #9a5b13;
  --warm-soft: #fff7e8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: #eef2f4;
}

button, input { font: inherit; letter-spacing: 0; }

button {
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--paper);
  color: #24313b;
  min-height: 38px;
  padding: 7px 12px;
  cursor: pointer;
}

button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }
button:focus-visible { outline: 3px solid rgba(8, 126, 139, 0.25); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: 0.45; }

.button-link {
  display: inline-flex;
  align-items: center;
  min-height: 38px;
  padding: 7px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  color: #24313b;
  background: var(--paper);
  text-decoration: none;
}
.button-link:hover { border-color: var(--accent); color: var(--accent-dark); }
.button-link:focus-visible { outline: 3px solid rgba(8, 126, 139, 0.25); outline-offset: 2px; }

.app-shell {
  width: min(1080px, calc(100% - 32px));
  margin: 24px auto;
  background: var(--paper);
  border: 1px solid var(--line);
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
}

.eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 12px; }
h1 { margin: 0; font-size: 30px; line-height: 1; }
.base-formula {
  margin: 8px 0 0;
  color: #34434d;
  font-family: Cambria, "Times New Roman", serif;
  font-size: 18px;
  line-height: 1.35;
  white-space: nowrap;
}
.base-formula sup { font-size: 0.7em; }
h2 { margin: 0; font-size: 17px; }
h3 { margin: 0 0 10px; font-size: 14px; color: #34434d; }

.file-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.danger-button { color: var(--danger); border-color: #d8a7a8; }
.danger-button:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

.calculator, .function-application-section, .function-definition-section, .values-section, .details-section { padding: 22px 24px; }
.calculator, .function-application-section, .function-definition-section, .values-section { border-bottom: 1px solid var(--line); }

.formula-line {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 64px;
  margin-top: 12px;
  overflow-x: auto;
  padding: 2px 1px 6px;
}

.formula-name, .formula-punctuation {
  flex: 0 0 auto;
  font-family: Cambria, "Times New Roman", serif;
  font-size: 25px;
}

.input-slot, .result-slot {
  flex: 0 0 auto;
  width: 132px;
  min-height: 48px;
  border: 2px dashed var(--line-strong);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 10px;
  background: #f8fafb;
  font-family: Cambria, "Times New Roman", serif;
  font-size: 21px;
  overflow-wrap: anywhere;
}

.input-slot.filled { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: #064e55; }
.input-slot.drag-over { box-shadow: 0 0 0 4px rgba(8, 126, 139, 0.18); }

.result-slot {
  width: min(310px, 34vw);
  border-style: solid;
  border-color: #8cc89c;
  background: var(--result-soft);
  color: var(--result);
  font-weight: 700;
}

.result-slot.error { border-color: #d8a7a8; background: var(--danger-soft); color: var(--danger); }
.primary-button { background: var(--accent); border-color: var(--accent); color: white; }
.primary-button:hover:not(:disabled) { background: var(--accent-dark); color: white; border-color: var(--accent-dark); }
.add-button { flex: 0 0 auto; min-width: 76px; }

.direct-preview { min-height: 22px; color: var(--muted); font-family: Cambria, "Times New Roman", serif; overflow-wrap: anywhere; }
.notice { min-height: 22px; margin-top: 4px; color: var(--warm); font-size: 13px; }
.notice.error { color: var(--danger); }

.function-application-empty { min-height: 64px; display: flex; align-items: center; color: var(--muted); }
.custom-calculator { margin-top: 0; }
.custom-definition-row { display: flex; align-items: center; gap: 8px; }
.custom-definition-row label { flex: 0 0 auto; color: #34434d; font-size: 14px; }
.custom-definition-input {
  flex: 1 1 360px;
  min-width: 180px;
  min-height: 38px;
  padding: 7px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: #fbfcfc;
  color: #24313b;
  font-family: Cambria, "Times New Roman", serif;
}
.custom-definition-input:focus-visible { outline: 3px solid rgba(8, 126, 139, 0.25); outline-offset: 2px; }
.custom-definition-status { min-height: 20px; margin-top: 5px; color: var(--muted); font-size: 13px; }
.custom-definition-status.error { color: var(--danger); }
.custom-formula-line { min-height: 56px; margin-top: 4px; }
.custom-input-slots { display: inline-flex; align-items: center; gap: 9px; flex: 0 1 auto; }
.custom-input-slots .formula-punctuation { font-size: 25px; }

.section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-heading > div { display: flex; align-items: baseline; gap: 10px; }
.count { color: var(--muted); font-size: 12px; }

.value-list { display: flex; align-items: stretch; flex-wrap: wrap; gap: 10px; min-height: 48px; }
.value-item { position: relative; display: inline-flex; max-width: 100%; }
.value-button {
  min-width: 64px;
  max-width: min(440px, 76vw);
  min-height: 44px;
  padding: 8px 13px;
  background: #f7f9fa;
  font-family: Cambria, "Times New Roman", serif;
  font-size: 18px;
  font-weight: 600;
  overflow-wrap: anywhere;
  text-align: left;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.value-button:active { cursor: grabbing; }
.value-item:not(.protected) .value-button { border-radius: 6px 0 0 6px; }
.value-item.protected .value-button { padding-right: 13px; border-color: #d1ad67; background: var(--warm-soft); }
.value-item.selected .value-button { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.delete-button {
  position: static;
  width: 34px;
  min-height: 44px;
  padding: 0;
  border: 1px solid var(--line-strong);
  border-left: 0;
  border-radius: 0 6px 6px 0;
  background: #f7f9fa;
  color: var(--danger);
  font-size: 21px;
  line-height: 1;
}

.details-empty { color: var(--muted); padding: 10px 0; }
.selected-value-line { margin-bottom: 18px; font-size: 16px; }
.selected-value-line strong { font-family: Cambria, "Times New Roman", serif; font-size: 22px; }
.detail-block + .detail-block { margin-top: 22px; }
.formula-entry { padding: 9px 0; border-bottom: 1px solid #e3e8eb; font-family: Cambria, "Times New Roman", serif; overflow-wrap: anywhere; }
.formula-entry:last-child { border-bottom: 0; }
.empty-formulas { color: var(--muted); }

.tree-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.tree-heading h3 { margin: 0; }
.tree-controls { display: flex; align-items: center; gap: 5px; }
.icon-button {
  width: 34px;
  min-height: 34px;
  padding: 0;
  font-size: 19px;
  line-height: 1;
}
.zoom-level { width: 46px; color: var(--muted); font-size: 12px; text-align: center; }
.tree-viewport {
  position: relative;
  width: 100%;
  height: min(58vh, 520px);
  min-height: 280px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #fbfcfc;
  cursor: grab;
  touch-action: none;
}
.tree-viewport:active { cursor: grabbing; }
.tree-viewport:focus-visible { outline: 3px solid rgba(8, 126, 139, 0.25); outline-offset: 2px; }
.tree-canvas {
  width: max-content;
  min-width: 100%;
  padding: 10px 14px 22px;
  transform-origin: 0 0;
  will-change: transform;
  user-select: none;
}

.tree-derivation { border-left: 3px solid #a9cdd1; padding: 4px 0 4px 14px; margin: 8px 0; }
.tree-derivation summary { cursor: pointer; font-family: Cambria, "Times New Roman", serif; font-weight: 700; overflow-wrap: anywhere; }
.tree-inputs, .rewrite-steps { margin: 9px 0 6px; padding-left: 22px; }
.tree-inputs li, .rewrite-steps li { margin: 6px 0; overflow-wrap: anywhere; }
.tree-value { color: #34434d; }
.tree-label { font-family: Cambria, "Times New Roman", serif; font-weight: 600; }
.rewrite-steps { color: var(--muted); font-size: 13px; }
.expanded-eml-derivation { border-left-color: #437f88; }
.expanded-eml-node { min-width: 0; margin: 8px 0; }
.expanded-eml-heading { cursor: pointer; font-family: Cambria, "Times New Roman", serif; font-weight: 700; color: #173f45; }
.expanded-eml-heading { list-style: none; }
.expanded-eml-heading::-webkit-details-marker { display: none; }
.expanded-eml-inputs { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 0 14px; }
.expanded-eml-input { min-width: 0; color: #34434d; font-family: Cambria, "Times New Roman", serif; overflow-wrap: anywhere; }
.expanded-eml-label { font-weight: 700; }
.expanded-eml-value { overflow-wrap: anywhere; }

/* 推导过程：从初始值到当前数值的线性建造顺序 */
.trace-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.trace-heading h3 { margin: 0; }
.trace-summary { color: var(--muted); font-size: 13px; }
.trace-steps { list-style: none; margin: 0; padding: 0; counter-reset: trace; }
.trace-step {
  position: relative;
  margin-left: 11px;
  padding: 10px 0 10px 34px;
  border-left: 2px solid var(--line);
}
.trace-step::before {
  counter-increment: trace;
  content: counter(trace);
  position: absolute;
  left: -13px;
  top: 9px;
  width: 22px;
  height: 22px;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
  color: var(--muted);
  font-size: 12px;
  line-height: 18px;
  text-align: center;
}
.trace-step:last-child { border-left-color: transparent; }
.trace-step.target::before {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-dark);
  font-weight: 700;
}
.trace-step-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.trace-step-value { font-family: Cambria, "Times New Roman", serif; font-size: 16px; overflow-wrap: anywhere; }
.trace-step-formula { color: var(--muted); font-family: Cambria, "Times New Roman", serif; font-size: 13px; overflow-wrap: anywhere; }
.trace-step-tag { padding: 1px 7px; border-radius: 999px; background: #eef2f6; color: var(--muted); font-size: 11px; }
.trace-step-tag.target-tag { background: var(--accent-soft); color: var(--accent-dark); }
.trace-step-inputs { margin-top: 4px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.trace-step-rewrites { margin-top: 6px; color: var(--muted); font-size: 12px; }
.trace-step-rewrites summary { cursor: pointer; }
.trace-step-rewrites ol { margin: 6px 0 0; padding-left: 20px; }
.trace-note { margin-top: 10px; color: var(--muted); font-size: 12px; }
.trace-note.warning { color: #b4690e; }

@media (max-width: 720px) {
  .app-shell { width: 100%; margin: 0; border-left: 0; border-right: 0; }
  .app-header { align-items: flex-start; flex-direction: column; padding: 18px 16px; }
  .file-actions { justify-content: flex-start; }
  .calculator, .function-application-section, .function-definition-section, .values-section, .details-section { padding: 20px 16px; }
  .formula-line { gap: 7px; flex-wrap: wrap; overflow-x: visible; }
  .formula-name, .formula-punctuation { font-size: 21px; }
  .custom-definition-row { align-items: stretch; flex-wrap: wrap; }
  .custom-definition-input { flex-basis: 100%; width: 100%; }
  .custom-input-slots { gap: 7px; flex-wrap: wrap; }
  .custom-input-slots .formula-punctuation { font-size: 21px; }
  .input-slot { width: 96px; }
  .result-slot { width: min(240px, 100%); }
  .value-button { max-width: calc(100vw - 32px); }
  .tree-viewport { height: min(54vh, 440px); min-height: 240px; }
}

  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">符号计算工作台</p>
        <h1>EML</h1>
        <p class="base-formula" aria-label="基础公式：EML x y 等于 e 的 x 次方减去 y 的自然对数">
          EML(x, y) = e<sup>x</sup> - ln(y)
        </p>
      </div>
      <div class="file-actions" aria-label="文件操作">
        <a href="#" id="saveButton" class="button-link" download="eml-workbench-v2.json">保存列表</a>
        <button type="button" id="importButton">导入列表</button>
        <button type="button" id="clearButton" class="danger-button">清空非初始值</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <section class="calculator" aria-labelledby="calculatorTitle">
      <h2 id="calculatorTitle">函数应用</h2>
      <div class="formula-line">
        <span class="formula-name">EML(</span>
        <button type="button" class="input-slot" id="slotX" data-slot="x" aria-label="x 输入位置">x</button>
        <span class="formula-punctuation">,</span>
        <button type="button" class="input-slot" id="slotY" data-slot="y" aria-label="y 输入位置">y</button>
        <span class="formula-punctuation">) =</span>
        <output class="result-slot" id="resultOutput" aria-live="polite">?</output>
        <button type="button" class="primary-button add-button" id="addButton" disabled>添加</button>
      </div>
      <div class="direct-preview" id="directPreview">等待 x、y</div>
      <div class="notice" id="notice" role="status" aria-live="polite"></div>
      <div class="custom-function-applications" id="customFunctionApplications"></div>
    </section>

    <section class="function-definition-section" aria-labelledby="customDefinitionTitle">
      <h2 id="customDefinitionTitle">函数定义</h2>
      <div class="custom-definition-row">
        <label for="customDefinition">定义</label>
        <input id="customDefinition" class="custom-definition-input" type="text"
          placeholder="例如 f(x) = EML(x, 1)" autocomplete="off">
        <button type="button" id="customApplyButton">保存定义</button>
      </div>
      <div id="customDefinitionStatus" class="custom-definition-status" role="status" aria-live="polite"></div>
    </section>

    <section class="values-section" aria-labelledby="valuesTitle">
      <div class="section-heading">
        <div>
          <h2 id="valuesTitle">数值栏</h2>
          <span class="count" id="valueCount">1 个数值</span>
        </div>
      </div>
      <div class="value-list" id="valueList"></div>
    </section>

    <section class="details-section" aria-labelledby="detailsTitle">
      <div class="section-heading">
        <h2 id="detailsTitle">公式详情</h2>
      </div>
      <div class="details-empty" id="detailsEmpty">选择一个数值查看公式来源</div>
      <div class="details-content" id="detailsContent" hidden>
        <div class="selected-value-line">当前数值：<strong id="selectedValue"></strong></div>
        <div class="detail-block">
          <h3>直接公式</h3>
          <div id="directFormulaList"></div>
        </div>
        <div class="detail-block">
          <div class="trace-heading">
            <h3>推导过程</h3>
            <span id="traceSummary" class="trace-summary" aria-live="polite"></span>
          </div>
          <div id="derivationTrace" class="trace-list"></div>
        </div>
        <div class="detail-block">
          <div class="tree-heading">
            <h3>完整计算树</h3>
            <div class="tree-controls" aria-label="计算树视图控制">
              <button type="button" id="treeZoomOut" class="icon-button" title="缩小计算树" aria-label="缩小计算树">−</button>
              <output id="treeZoomLevel" class="zoom-level" aria-live="polite">100%</output>
              <button type="button" id="treeZoomIn" class="icon-button" title="放大计算树" aria-label="放大计算树">+</button>
              <button type="button" id="treeResetView" class="icon-button" title="复位计算树视图" aria-label="复位计算树视图">↺</button>
              <button type="button" id="treeExpandMore" class="icon-button" title="展开更多计算层级" aria-label="展开更多计算层级">⇣</button>
            </div>
          </div>
          <div id="calculationTreeViewport" class="tree-viewport" tabindex="0" aria-label="完整计算树，可拖动或使用 W A S D 键移动">
            <div id="calculationTree" class="tree-canvas"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
/* expression.js */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  root.EMLExpression = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const TYPES = Object.freeze({
    CONSTANT: "constant",
    INTEGER: "integer",
    NEG: "neg",
    ADD: "add",
    SUB: "sub",
    MUL: "mul",
    DIV: "div",
    POW: "pow",
    LN: "ln",
    SQRT: "sqrt",
    SIN: "sin",
  });

  const constant = (name) => ({ type: TYPES.CONSTANT, name });
  const integer = (value) => ({ type: TYPES.INTEGER, value: Number(value) });
  const neg = (child) => ({ type: TYPES.NEG, child });
  const add = (left, right) => ({ type: TYPES.ADD, left, right });
  const sub = (left, right) => ({ type: TYPES.SUB, left, right });
  const mul = (left, right) => ({ type: TYPES.MUL, left, right });
  const div = (numerator, denominator) => ({ type: TYPES.DIV, numerator, denominator });
  const pow = (base, exponent) => ({ type: TYPES.POW, base, exponent });
  const ln = (argument) => ({ type: TYPES.LN, argument });
  const sqrt = (argument) => ({ type: TYPES.SQRT, argument });
  const sin = (argument) => ({ type: TYPES.SIN, argument });

  const ONE = integer(1);
  const ZERO = integer(0);
  const E = constant("e");
  const PI = constant("pi");
  const I = constant("i");
  const MAX_EXPRESSION_DEPTH = 64;
  const MAX_EXPRESSION_NODES = 2000;
  const ALLOWED_CONSTANTS = new Set(["e", "pi", "i"]);

  function canonicalKey(expression) {
    switch (expression.type) {
      case TYPES.CONSTANT:
        return `const:${expression.name}`;
      case TYPES.INTEGER:
        return `int:${expression.value}`;
      case TYPES.NEG:
        return `neg(${canonicalKey(expression.child)})`;
      case TYPES.ADD: {
        const keys = [canonicalKey(expression.left), canonicalKey(expression.right)].sort();
        return `add(${keys[0]},${keys[1]})`;
      }
      case TYPES.SUB:
        return `sub(${canonicalKey(expression.left)},${canonicalKey(expression.right)})`;
      case TYPES.MUL: {
        const keys = [canonicalKey(expression.left), canonicalKey(expression.right)].sort();
        return `mul(${keys[0]},${keys[1]})`;
      }
      case TYPES.DIV:
        return `div(${canonicalKey(expression.numerator)},${canonicalKey(expression.denominator)})`;
      case TYPES.POW:
        return `pow(${canonicalKey(expression.base)},${canonicalKey(expression.exponent)})`;
      case TYPES.LN:
        return `ln(${canonicalKey(expression.argument)})`;
      case TYPES.SQRT:
        return `sqrt(${canonicalKey(expression.argument)})`;
      case TYPES.SIN:
        return `sin(${canonicalKey(expression.argument)})`;
      default:
        throw new Error(`未知表达式类型：${expression.type}`);
    }
  }

  const isSame = (left, right) => canonicalKey(left) === canonicalKey(right);
  const isInteger = (expression, value) => expression.type === TYPES.INTEGER && expression.value === value;
  const isConstant = (expression, name) => expression.type === TYPES.CONSTANT && expression.name === name;

  function precedence(expression) {
    if ([TYPES.ADD, TYPES.SUB].includes(expression.type)) return 1;
    if ([TYPES.MUL, TYPES.DIV].includes(expression.type)) return 2;
    if (expression.type === TYPES.POW) return 3;
    return 4;
  }

  function render(expression, parentPrecedence = 0) {
    const ownPrecedence = precedence(expression);
    let text;
    switch (expression.type) {
      case TYPES.CONSTANT:
        text = expression.name === "pi" ? "π" : expression.name;
        break;
      case TYPES.INTEGER:
        text = String(expression.value);
        break;
      case TYPES.NEG:
        if (expression.child.type === TYPES.NEG) {
          text = `-(${render(expression.child)})`;
        } else if (
          expression.child.type === TYPES.MUL &&
          [expression.child.left, expression.child.right].every((part) =>
            [TYPES.CONSTANT, TYPES.INTEGER].includes(part.type)
          )
        ) {
          text = `-${render(expression.child, 2)}`;
        } else {
          text = `-${render(expression.child, ownPrecedence)}`;
        }
        break;

    showNotice("已撤销上一步操作。", false);
    render();
  }

  function showNotice(message, isError = false) {
    elements.notice.textContent = message || "";
    elements.notice.classList.toggle("error", isError);
  }

  function currentValue(valueId) {
    return valueId ? state.values[valueId] : null;
  }

  function recomputePreview() {
    const x = currentValue(state.inputXId);
    const y = currentValue(state.inputYId);
    preview = x && y ? Evaluator.evaluateEML(x.canonicalExpression, y.canonicalExpression) : null;
  }

  function renderSlot(element, value, placeholder) {
    element.textContent = value ? value.displayText : placeholder;
    element.classList.toggle("filled", Boolean(value));
    element.title = value ? value.displayText : `${placeholder} 输入位置`;
  }

  function renderCalculator() {
    renderSlot(elements.slotX, currentValue(state.inputXId), "x");
    renderSlot(elements.slotY, currentValue(state.inputYId), "y");
    elements.result.classList.toggle("error", Boolean(preview && (!preview.ok || preview.limitReached)));

    if (!preview) {
      elements.result.textContent = "?";
      elements.directPreview.textContent = "等待 x、y";
      elements.add.disabled = true;
      return;
    }

    if (!preview.ok) {
      elements.result.textContent = "未定义";
      elements.directPreview.textContent = preview.error;
      elements.add.disabled = true;
      return;
    }

    if (preview.limitReached) {
      elements.result.textContent = preview.displayText;
      elements.directPreview.textContent = "化简达到安全上限，当前结果尚不能添加。";
      elements.add.disabled = true;
      return;
    }

    elements.result.textContent = preview.displayText;
    elements.directPreview.textContent = preview.directFormula;
    elements.add.disabled = false;
  }

  function renderCustomCalculators() {
    elements.customFunctionApplications.replaceChildren();
    const functions = Store.getCustomFunctions(state);
    const definitions = functions
      .map((custom) => Composition.parseDefinition(custom.definitionText))
      .filter((parsed) => parsed.ok)
      .map((parsed) => parsed.definition);
    for (const custom of functions) {
      const parsed = Composition.parseDefinition(custom.definitionText);
      if (!parsed.ok) continue;
      const definition = parsed.definition;
      const panel = document.createElement("div");
      panel.className = "custom-calculator";
      const line = document.createElement("div");
      line.className = "formula-line custom-formula-line";
      const name = document.createElement("span");
      name.className = "formula-name";
      name.textContent = `${definition.name}(`;
      line.appendChild(name);
      const slots = document.createElement("span");
      slots.className = "custom-input-slots";
      definition.parameterNames.forEach((parameterName, index) => {
      if (index > 0) {
        const comma = document.createElement("span");
        comma.className = "formula-punctuation";
        comma.textContent = ",";
          slots.appendChild(comma);
      }
      const slot = document.createElement("button");
      slot.type = "button";
      slot.className = "input-slot";
        slot.dataset.slot = `custom:${custom.id}:${index}`;
        slot.setAttribute("aria-label", `${parameterName} 输入位置`);
        renderSlot(slot, currentValue(custom.inputValueIds[index]), parameterName);
      bindSlot(slot, slot.dataset.slot);
        slots.appendChild(slot);
      });
      line.appendChild(slots);
      const punctuation = document.createElement("span");
      punctuation.className = "formula-punctuation";
      punctuation.textContent = ") =";
      line.appendChild(punctuation);
      const result = document.createElement("output");
      result.className = "result-slot";
      const inputs = custom.inputValueIds.map(currentValue);
      const evaluation = inputs.some((value) => !value) ? null : Composition.evaluate(definition, inputs.map((value) => value.canonicalExpression), definitions);
      result.textContent = !evaluation ? "?" : !evaluation.ok ? "未定义" : evaluation.displayText;
      result.classList.toggle("error", Boolean(evaluation && (!evaluation.ok || evaluation.limitReached)));
      line.appendChild(result);
      const add = document.createElement("button");
      add.type = "button";
      add.className = "primary-button add-button";
      add.textContent = "添加";
      add.disabled = !evaluation || !evaluation.ok || evaluation.limitReached;
      add.addEventListener("click", () => addCustomEvaluation(custom, evaluation));
      line.appendChild(add);
      panel.appendChild(line);
      const direct = document.createElement("div");
      direct.className = "direct-preview";
      direct.textContent = !evaluation ? "等待全部参数。" : !evaluation.ok ? evaluation.error : evaluation.limitReached ? "化简达到安全上限，当前结果尚不能添加。" : (evaluation.expandedFormula || evaluation.directFormula);
      panel.appendChild(direct);
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "delete-function-button";
      remove.textContent = "删除函数";
      remove.addEventListener("click", () => deleteCustomFunction(custom.id));
      panel.appendChild(remove);
      elements.customFunctionApplications.appendChild(panel);
    }
    elements.customDefinitionStatus.textContent = customDefinitionError || "支持多个函数；只允许参数名和 EML(...) 的嵌套组合。";
    elements.customDefinitionStatus.classList.toggle("error", Boolean(customDefinitionError));
  }

  function makeDeleteButton(valueId) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "delete-button";
    button.textContent = "×";
    button.title = "删除该数值";
    button.setAttribute("aria-label", "删除该数值");
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      const result = Store.deleteValue(state, valueId);
      if (result.status === "referenced") {
        const closure = Store.deletionClosure(state, valueId);
        if (!window.confirm(`该数值及其 ${closure.length - 1} 个依赖结果会一并删除，相关公式也会删除。是否继续？`)) return;
        const cascade = Store.deleteValueCascade(state, valueId);
        if (cascade.status !== "deleted") {
          showNotice("该数值存在受保护的依赖，无法级联删除。", true);
          return;
        }
        commitState(cascade.state);
        showNotice(`已删除 ${cascade.deletedValueIds.length} 个相互依赖的数值及其公式。`, false);
        render();
        return;
      }
      if (result.status !== "deleted") return;
      commitState(result.state);
      showNotice("已删除数值。", false);
      render();
    });
    return button;
  }

  function renderValues() {
    elements.valueList.replaceChildren();
    elements.valueCount.textContent = `${state.valueOrder.length} 个数值`;

    for (const valueId of state.valueOrder) {
      const value = state.values[valueId];
      if (!value) continue;
      const item = document.createElement("div");
      item.className = "value-item";
      item.classList.toggle("protected", Boolean(value.protected));
      item.classList.toggle("selected", state.selectedValueId === valueId);
      item.dataset.valueId = valueId;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "value-button";
      button.textContent = value.displayText;
      button.title = value.protected ? `${value.displayText}（初始值，不可删除）` : value.displayText;
      button.draggable = false;
      button.setAttribute("aria-pressed", String(state.selectedValueId === valueId));
      button.addEventListener("click", () => {
        if (suppressValueClick) {
          suppressValueClick = false;
          return;
        }
        state = Store.selectValue(state, valueId);
        persistState();
        showNotice("");
        render();
      });
      button.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        pointerDrag = { valueId, startX: event.clientX, startY: event.clientY, active: false, pointerId: event.pointerId };
        button.setPointerCapture(event.pointerId);
      });
      button.addEventListener("pointermove", (event) => {
        if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
        const distance = Math.hypot(event.clientX - pointerDrag.startX, event.clientY - pointerDrag.startY);
        if (distance > 6) pointerDrag.active = true;
        if (!pointerDrag.active) return;
        event.preventDefault();
        document.querySelectorAll(".input-slot").forEach((slot) => slot.classList.remove("drag-over"));
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".input-slot");
        if (target) target.classList.add("drag-over");
      });
      button.addEventListener("pointerup", (event) => {
        if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
        const drag = pointerDrag;
        pointerDrag = null;
        document.querySelectorAll(".input-slot").forEach((slot) => slot.classList.remove("drag-over"));
        if (!drag.active) return;
        suppressValueClick = true;
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".input-slot");
        if (target) assignInput(target.dataset.slot, drag.valueId);
      });

      item.appendChild(button);
      if (!value.protected) item.appendChild(makeDeleteButton(valueId));
      elements.valueList.appendChild(item);
    }
  }

  function appendValueBranch(container, label, node) {
    const item = document.createElement("li");
    item.className = "tree-value";
    const heading = document.createElement("span");
    heading.className = "tree-label";
    heading.textContent = `${label}: ${node.label || "未知"}${node.initial ? "（初始值）" : ""}`;
    item.appendChild(heading);

    if (node.type === "cycle") {
      item.append("（检测到循环，已停止展开）");
    } else if (node.type === "deferred") {
      item.append(node.reason === "node-limit" ? "（已达到节点显示上限）" : "（还有更早的来源）");
    } else if (node.derivations && node.derivations.length) {
      node.derivations.forEach((derivation) => item.appendChild(renderDerivation(derivation)));
    }
    container.appendChild(item);
  }

  function renderExpandedEml(node, expanded) {
    if (!node || node.type !== "eml") {
      const value = document.createElement("div");
      value.className = "expanded-eml-value";
      const label = document.createElement("span");
      label.textContent = node?.label || "未知";
      value.appendChild(label);
      const source = node?.source;
      if (source?.type === "cycle") {
        value.append("（检测到循环，已停止展开）");
      } else if (source?.type === "deferred") {
        value.append("（来源已折叠）");
      } else if (source?.initial) {
        value.append("（初始值）");
      } else if (source?.derivations?.length) {
        source.derivations.forEach((derivation) => value.appendChild(renderDerivation(derivation, true)));
      }
      return value;
    }
    const element = document.createElement("details");
    element.className = "expanded-eml-node";
    element.open = Boolean(expanded);
    const heading = document.createElement("summary");
    heading.className = "expanded-eml-heading";
    heading.textContent = "EML";
    element.appendChild(heading);
    const inputs = document.createElement("div");
    inputs.className = "expanded-eml-inputs";
    ["x", "y"].forEach((name, index) => {
      const branch = document.createElement("div");
      branch.className = "expanded-eml-input";
      const label = document.createElement("span");
      label.className = "expanded-eml-label";
      label.textContent = `${name}: `;
      branch.appendChild(label);
      branch.appendChild(renderExpandedEml(node.inputs?.[index], true));
      inputs.appendChild(branch);
    });
    element.appendChild(inputs);
    return element;
  }

  function renderDerivation(derivation, expanded = true) {
    if (derivation.emlTree?.type === "eml") {
      const container = document.createElement("div");
      container.className = "tree-derivation expanded-eml-derivation";
      container.appendChild(renderExpandedEml(derivation.emlTree, expanded));
      return container;
    }
    const details = document.createElement("details");
    details.className = "tree-derivation";
    details.open = true;
    const summary = document.createElement("summary");
    summary.textContent = derivation.directFormula || "公式数据缺失";
    details.appendChild(summary);

    if (derivation.rewriteSteps && derivation.rewriteSteps.length) {
      const steps = document.createElement("ol");
      steps.className = "rewrite-steps";
      for (const step of derivation.rewriteSteps) {
        const item = document.createElement("li");
        item.textContent = `${step.before} → ${step.after}`;
        steps.appendChild(item);
      }
      details.appendChild(steps);
    }

    const inputs = document.createElement("ul");
    inputs.className = "tree-inputs";
    const branches = Array.isArray(derivation.inputs)
      ? derivation.inputs
      : [{ name: "x", node: derivation.x }, { name: "y", node: derivation.y }];
    branches.forEach((input) => appendValueBranch(inputs, input.name, input.node));
    details.appendChild(inputs);
    return details;
  }

  /** 把输入的来源描述为「值（第 N 步）」，让复用关系一眼可见。 */
  function describeTraceRef(ref) {
    if (!ref) return "—";
    const label = ref.displayText || "—";
    if (ref.refIndex === null || ref.refIndex === undefined) return label;
    return `${label}（第 ${ref.refIndex} 步）`;
  }

  function renderTraceStep(step) {
    const item = document.createElement("li");
    item.className = `trace-step ${step.kind}${step.isTarget ? " target" : ""}`;

    const head = document.createElement("div");
    head.className = "trace-step-head";
    const value = document.createElement("strong");
    value.className = "trace-step-value";
    value.textContent = step.displayText;
    head.appendChild(value);

    if (step.kind === "derived") {
      const formula = document.createElement("span");
      formula.className = "trace-step-formula";
      formula.textContent = step.directFormula;
      head.appendChild(formula);
    } else {
      const tag = document.createElement("span");
      tag.className = "trace-step-tag";
      tag.textContent = "初始值";
      head.appendChild(tag);
    }
    if (step.isTarget) {
      const tag = document.createElement("span");
      tag.className = "trace-step-tag target-tag";
      tag.textContent = "目标";
      head.appendChild(tag);
    }
    item.appendChild(head);

    if (step.kind === "derived") {
      const inputs = document.createElement("div");
      inputs.className = "trace-step-inputs";
      const refs = Array.isArray(step.inputs)
        ? step.inputs
        : [{ name: "x", value: step.x }, { name: "y", value: step.y }];
      inputs.textContent = refs.map((input) => `${input.name} = ${describeTraceRef(input.value)}`).join(" · ");
      item.appendChild(inputs);

      if (step.rewriteSteps && step.rewriteSteps.length) {
        const details = document.createElement("details");
        details.className = "trace-step-rewrites";
        const summary = document.createElement("summary");
        summary.textContent = `化简 ${step.rewriteSteps.length} 步`;
        details.appendChild(summary);
        const list = document.createElement("ol");
        for (const rewrite of step.rewriteSteps) {
          const row = document.createElement("li");
          row.textContent = `${rewrite.before} → ${rewrite.after}`;
          list.appendChild(row);
        }
        details.appendChild(list);
        item.appendChild(details);
      }
    }
    return item;
  }

  function renderTrace() {
    const trace = Trace.buildDerivationTrace(state, state.selectedValueId, { maxSteps: Trace.MAX_TRACE_STEPS });
    elements.derivationTrace.replaceChildren();

    if (!trace.ok && trace.reason === "missing-value") {
      elements.traceSummary.textContent = "";
      const empty = document.createElement("div");
      empty.className = "empty-formulas";
      empty.textContent = "找不到该数值的推导记录。";
      elements.derivationTrace.appendChild(empty);
      return;
    }

    elements.traceSummary.textContent = trace.truncated
      ? `已截断（前 ${trace.steps.length} 步）`
      : `共 ${trace.steps.length} 步`;

    const list = document.createElement("ol");
    list.className = "trace-steps";
    for (const step of trace.steps) list.appendChild(renderTraceStep(step));
    elements.derivationTrace.appendChild(list);

    if (trace.extraSourceCount > 0) {
      const note = document.createElement("div");
      note.className = "trace-note";
      note.textContent = `该数值另有 ${trace.extraSourceCount} 条来源公式，此处展示最早推出来的那条。`;
      elements.derivationTrace.appendChild(note);
    }
    if (trace.truncated) {
      const note = document.createElement("div");
      note.className = "trace-note warning";
      note.textContent = "推导链超过展示上限，已截断。";
      elements.derivationTrace.appendChild(note);
    }
  }

  function renderDetails() {
    const details = Store.getDetails(state, state.selectedValueId, {
      maxDepth: treeDepth,
      maxNodes: Store.MAX_TREE_NODES,
    });
    if (treeController.ensureValue(state.selectedValueId)) {
      treeDepth = Store.DEFAULT_TREE_DEPTH;
      return renderDetails();
    }
    elements.detailsEmpty.hidden = Boolean(details);
    elements.detailsContent.hidden = !details;
    elements.directFormulaList.replaceChildren();
    elements.calculationTree.replaceChildren();
    treeController.setExpandable(false, false);
    if (!details) return;

    elements.selectedValue.textContent = details.value.displayText;
    if (details.directFormulas.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-formulas";
      empty.textContent = details.value.protected ? "初始值，没有上游公式。" : "没有公式来源。";
      elements.directFormulaList.appendChild(empty);
    } else {
      for (const formula of details.directFormulas) {
        const row = document.createElement("div");
        row.className = "formula-entry";
        row.textContent = formula;
        elements.directFormulaList.appendChild(row);
      }
    }

    // 推导过程：线性列出从初始值到当前选中值的建造顺序
    renderTrace();

    if (details.tree.derivations.length === 0) {
      const root = document.createElement("div");
      root.className = "empty-formulas";
      root.textContent = `${details.value.displayText}（初始值）`;
      elements.calculationTree.appendChild(root);
    } else {
      details.tree.derivations.forEach((derivation) => {
        elements.calculationTree.appendChild(renderDerivation(derivation));
      });
    }
    const hasDeferredBranches = Store.treeHasDeferredBranches(details.tree);
    treeController.setExpandable(hasDeferredBranches, treeDepth >= Store.MAX_TREE_DEPTH);
    requestAnimationFrame(treeController.apply);
  }

  function render() {
    renderCalculator();
    renderCustomCalculators();
    renderValues();
    renderDetails();
  }

  function assignInput(slotName, valueId) {
    if (!state.values[valueId]) {
      showNotice("拖入的数值无效。", true);
      return;
    }
    if (slotName.startsWith("custom:")) {
      const parts = slotName.split(":");
      const inputIndex = Number(parts.pop());
      commitState(Store.setCustomInput(state, parts.slice(1).join(":"), inputIndex, valueId));
    } else {
      commitState(Store.setInput(state, slotName, valueId));
    }
    showNotice("");
    render();
  }

  function bindSlot(element, slotName) {
    element.addEventListener("dragover", (event) => {
      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
      element.classList.add("drag-over");
    });
    element.addEventListener("dragleave", () => element.classList.remove("drag-over"));
    element.addEventListener("drop", (event) => {
      event.preventDefault();
      element.classList.remove("drag-over");
      const valueId = event.dataTransfer.getData("application/x-eml-value") || event.dataTransfer.getData("text/plain");
      assignInput(slotName, valueId);
    });
    element.addEventListener("click", () => {
      if (!state.selectedValueId) {
        showNotice("请先选择数值栏中的一个数值。", true);
        return;
      }
      assignInput(slotName, state.selectedValueId);
    });
  }

  bindSlot(elements.slotX, "x");
  bindSlot(elements.slotY, "y");

  elements.customApply.addEventListener("click", () => {
    const parsed = Composition.parseDefinition(elements.customDefinition.value);
    if (!parsed.ok) {
      customDefinitionError = parsed.error;
      render();
      return;
    }
    const existingDefinitions = Store.getCustomFunctions(state)
      .map((custom) => Composition.parseDefinition(custom.definitionText))
      .filter((existing) => existing.ok)
      .map((existing) => existing.definition);
    const callValidation = Composition.validateDefinitionCalls(parsed.definition, existingDefinitions);
    if (!callValidation.ok) {
      customDefinitionError = callValidation.error;
      render();
      return;
    }
    const result = Store.addCustomFunction(state, parsed.definition.name, parsed.definition.displayText, parsed.definition.parameterNames.length);
    if (result.status !== "added") {
      customDefinitionError = result.status === "duplicate-name" ? "同名函数已存在，请使用其他函数名。" : "函数定义无效。";
      render();
      return;
    }
    commitState(result.state);
    customDefinitionError = "";
    elements.customDefinition.value = "";
    showNotice(`已添加函数 ${parsed.definition.name}。`, false);
    render();
  });

  elements.add.addEventListener("click", () => {
    if (!preview || !preview.ok || !state.inputXId || !state.inputYId) return;
    const result = Store.addEvaluation(state, preview, state.inputXId, state.inputYId);
    commitState(result.state);
    const messages = {
      "added-value": "已添加新数值和公式来源。",
      "added-formula": "数值已存在，已添加新的公式来源。",
      "duplicate-formula": "该数值和公式已经存在。",
      "cyclic-formula": "结果已存在，循环计算来源未保存；保留首次无环来源。",
    };
    showNotice(messages[result.status] || "无法添加当前结果。", result.status === "invalid");
    render();
  });

  function addCustomEvaluation(custom, evaluation) {
    if (!evaluation || !evaluation.ok || evaluation.limitReached || custom.inputValueIds.some((id) => !id)) return;
    const result = Store.addCompositionEvaluation(state, evaluation, custom.inputValueIds);
    commitState(result.state);
    const messages = {
      "added-value": "已添加组合函数结果和公式来源。",
      "added-formula": "数值已存在，已添加新的组合函数来源。",
      "duplicate-formula": "该组合函数公式已经存在。",
      "cyclic-formula": "结果已存在，循环计算来源未保存；保留首次无环来源。",
    };
    showNotice(messages[result.status] || "无法添加当前组合函数结果。", result.status === "invalid");
    render();
  }

  function deleteCustomFunction(functionId) {
    const result = Store.deleteCustomFunction(state, functionId);
    if (result.status !== "deleted") return;
    commitState(result.state);
    showNotice("已删除函数定义；已保存的数值和公式来源保持不变。", false);
    render();
  }

  elements.save.addEventListener("click", () => {
    const blob = new Blob([Persistence.serialize(state)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    elements.save.href = url;
    elements.save.download = "eml-workbench-v2.json";
    setTimeout(() => {
      URL.revokeObjectURL(url);
      elements.save.href = "#";
    }, 1000);
    persistState();
    showNotice("列表已保存到本地文件。", false);
  });

  elements.import.addEventListener("click", () => elements.importFile.click());
  elements.importFile.addEventListener("change", () => {
    const file = elements.importFile.files && elements.importFile.files[0];
    elements.importFile.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const restored = Persistence.deserialize(String(reader.result || ""));
      if (!restored.ok) {
        showNotice(`导入失败：${restored.error}。现有列表未改变。`, true);
        return;
      }
      commitState(restored.state);
      showNotice("导入成功。", false);
      render();
    };
    reader.onerror = () => showNotice("导入失败：无法读取文件。现有列表未改变。", true);
    reader.readAsText(file, "utf-8");
  });

  elements.clear.addEventListener("click", () => {
    if (!window.confirm("清空所有非初始数值和公式？初始值 1 会保留。")) return;
    commitState(Store.clearNonInitial());
    showNotice("已清空，初始值 1 已保留。", false);
    render();
  });

  document.addEventListener("keydown", (event) => {
    const target = event.target;
    const editingText = target instanceof HTMLElement && (
      target.matches("input, textarea") || target.isContentEditable
    );
    if (!editingText && (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
      event.preventDefault();
