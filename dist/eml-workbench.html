<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>EML 计算台</title>
  <style>
:root {
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  color: #18212f;
  background: #eef2f4;
  font-synthesis: none;
  letter-spacing: 0;
  --paper: #ffffff;
  --line: #cbd4d9;
  --line-strong: #8d9aa2;
  --muted: #66737c;
  --accent: #087e8b;
  --accent-dark: #075f68;
  --accent-soft: #e5f4f5;
  --result: #166534;
  --result-soft: #edf8ef;
  --danger: #a63d40;
  --danger-soft: #fff1f1;
  --warm: #9a5b13;
  --warm-soft: #fff7e8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: #eef2f4;
}

button, input { font: inherit; letter-spacing: 0; }

button {
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--paper);
  color: #24313b;
  min-height: 38px;
  padding: 7px 12px;
  cursor: pointer;
}

button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }
button:focus-visible { outline: 3px solid rgba(8, 126, 139, 0.25); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: 0.45; }

.button-link {
  display: inline-flex;
  align-items: center;
  min-height: 38px;
  padding: 7px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  color: #24313b;
  background: var(--paper);
  text-decoration: none;
}
.button-link:hover { border-color: var(--accent); color: var(--accent-dark); }
.button-link:focus-visible { outline: 3px solid rgba(8, 126, 139, 0.25); outline-offset: 2px; }

.app-shell {
  width: min(1080px, calc(100% - 32px));
  margin: 24px auto;
  background: var(--paper);
  border: 1px solid var(--line);
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
}

.eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 12px; }
h1 { margin: 0; font-size: 30px; line-height: 1; }
h2 { margin: 0; font-size: 17px; }
h3 { margin: 0 0 10px; font-size: 14px; color: #34434d; }

.file-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.danger-button { color: var(--danger); border-color: #d8a7a8; }
.danger-button:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

.calculator, .values-section, .details-section { padding: 22px 24px; }
.calculator, .values-section { border-bottom: 1px solid var(--line); }

.formula-line {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 64px;
  margin-top: 12px;
  overflow-x: auto;
  padding: 2px 1px 6px;
}

.formula-name, .formula-punctuation {
  flex: 0 0 auto;
  font-family: Cambria, "Times New Roman", serif;
  font-size: 25px;
}

.input-slot, .result-slot {
  flex: 0 0 auto;
  width: 132px;
  min-height: 48px;
  border: 2px dashed var(--line-strong);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 10px;
  background: #f8fafb;
  font-family: Cambria, "Times New Roman", serif;
  font-size: 21px;
  overflow-wrap: anywhere;
}

.input-slot.filled { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: #064e55; }
.input-slot.drag-over { box-shadow: 0 0 0 4px rgba(8, 126, 139, 0.18); }

.result-slot {
  width: min(310px, 34vw);
  border-style: solid;
  border-color: #8cc89c;
  background: var(--result-soft);
  color: var(--result);
  font-weight: 700;
}

.result-slot.error { border-color: #d8a7a8; background: var(--danger-soft); color: var(--danger); }
.primary-button { background: var(--accent); border-color: var(--accent); color: white; }
.primary-button:hover:not(:disabled) { background: var(--accent-dark); color: white; border-color: var(--accent-dark); }
.add-button { flex: 0 0 auto; min-width: 76px; }

.direct-preview { min-height: 22px; color: var(--muted); font-family: Cambria, "Times New Roman", serif; overflow-wrap: anywhere; }
.notice { min-height: 22px; margin-top: 4px; color: var(--warm); font-size: 13px; }
.notice.error { color: var(--danger); }

.section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-heading > div { display: flex; align-items: baseline; gap: 10px; }
.count { color: var(--muted); font-size: 12px; }

.value-list { display: flex; align-items: stretch; flex-wrap: wrap; gap: 10px; min-height: 48px; }
.value-item { position: relative; display: inline-flex; max-width: 100%; }
.value-button {
  min-width: 64px;
  max-width: min(440px, 76vw);
  min-height: 44px;
  padding: 8px 13px;
  background: #f7f9fa;
  font-family: Cambria, "Times New Roman", serif;
  font-size: 18px;
  font-weight: 600;
  overflow-wrap: anywhere;
  text-align: left;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.value-button:active { cursor: grabbing; }
.value-item:not(.protected) .value-button { border-radius: 6px 0 0 6px; }
.value-item.protected .value-button { padding-right: 13px; border-color: #d1ad67; background: var(--warm-soft); }
.value-item.selected .value-button { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.delete-button {
  position: static;
  width: 34px;
  min-height: 44px;
  padding: 0;
  border: 1px solid var(--line-strong);
  border-left: 0;
  border-radius: 0 6px 6px 0;
  background: #f7f9fa;
  color: var(--danger);
  font-size: 21px;
  line-height: 1;
}

.details-empty { color: var(--muted); padding: 10px 0; }
.selected-value-line { margin-bottom: 18px; font-size: 16px; }
.selected-value-line strong { font-family: Cambria, "Times New Roman", serif; font-size: 22px; }
.detail-block + .detail-block { margin-top: 22px; }
.formula-entry { padding: 9px 0; border-bottom: 1px solid #e3e8eb; font-family: Cambria, "Times New Roman", serif; overflow-wrap: anywhere; }
.formula-entry:last-child { border-bottom: 0; }
.empty-formulas { color: var(--muted); }

.tree-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.tree-heading h3 { margin: 0; }
.tree-controls { display: flex; align-items: center; gap: 5px; }
.icon-button {
  width: 34px;
  min-height: 34px;
  padding: 0;
  font-size: 19px;
  line-height: 1;
}
.zoom-level { width: 46px; color: var(--muted); font-size: 12px; text-align: center; }
.tree-viewport {
  position: relative;
  width: 100%;
  height: min(58vh, 520px);
  min-height: 280px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #fbfcfc;
  cursor: grab;
  touch-action: none;
}
.tree-viewport:active { cursor: grabbing; }
.tree-viewport:focus-visible { outline: 3px solid rgba(8, 126, 139, 0.25); outline-offset: 2px; }
.tree-canvas {
  width: max-content;
  min-width: 100%;
  padding: 10px 14px 22px;
  transform-origin: 0 0;
  will-change: transform;
  user-select: none;
}

.tree-derivation { border-left: 3px solid #a9cdd1; padding: 4px 0 4px 14px; margin: 8px 0; }
.tree-derivation summary { cursor: pointer; font-family: Cambria, "Times New Roman", serif; font-weight: 700; overflow-wrap: anywhere; }
.tree-inputs, .rewrite-steps { margin: 9px 0 6px; padding-left: 22px; }
.tree-inputs li, .rewrite-steps li { margin: 6px 0; overflow-wrap: anywhere; }
.tree-value { color: #34434d; }
.tree-label { font-family: Cambria, "Times New Roman", serif; font-weight: 600; }
.rewrite-steps { color: var(--muted); font-size: 13px; }

@media (max-width: 720px) {
  .app-shell { width: 100%; margin: 0; border-left: 0; border-right: 0; }
  .app-header { align-items: flex-start; flex-direction: column; padding: 18px 16px; }
  .file-actions { justify-content: flex-start; }
  .calculator, .values-section, .details-section { padding: 20px 16px; }
  .formula-line { gap: 7px; flex-wrap: wrap; overflow-x: visible; }
  .formula-name, .formula-punctuation { font-size: 21px; }
  .input-slot { width: 96px; }
  .result-slot { width: min(240px, 100%); }
  .value-button { max-width: calc(100vw - 32px); }
  .tree-viewport { height: min(54vh, 440px); min-height: 240px; }
}

  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">符号计算工作台</p>
        <h1>EML</h1>
      </div>
      <div class="file-actions" aria-label="文件操作">
        <a href="#" id="saveButton" class="button-link" download="eml-workbench-v2.json">保存列表</a>
        <button type="button" id="importButton">导入列表</button>
        <button type="button" id="clearButton" class="danger-button">清空非初始值</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <section class="calculator" aria-labelledby="calculatorTitle">
      <h2 id="calculatorTitle">计算</h2>
      <div class="formula-line">
        <span class="formula-name">EML(</span>
        <button type="button" class="input-slot" id="slotX" data-slot="x" aria-label="x 输入位置">x</button>
        <span class="formula-punctuation">,</span>
        <button type="button" class="input-slot" id="slotY" data-slot="y" aria-label="y 输入位置">y</button>
        <span class="formula-punctuation">) =</span>
        <output class="result-slot" id="resultOutput" aria-live="polite">?</output>
        <button type="button" class="primary-button add-button" id="addButton" disabled>添加</button>
      </div>
      <div class="direct-preview" id="directPreview">等待 x、y</div>
      <div class="notice" id="notice" role="status" aria-live="polite"></div>
    </section>

    <section class="values-section" aria-labelledby="valuesTitle">
      <div class="section-heading">
        <div>
          <h2 id="valuesTitle">数值栏</h2>
          <span class="count" id="valueCount">1 个数值</span>
        </div>
      </div>
      <div class="value-list" id="valueList"></div>
    </section>

    <section class="details-section" aria-labelledby="detailsTitle">
      <div class="section-heading">
        <h2 id="detailsTitle">公式详情</h2>
      </div>
      <div class="details-empty" id="detailsEmpty">选择一个数值查看公式来源</div>
      <div class="details-content" id="detailsContent" hidden>
        <div class="selected-value-line">当前数值：<strong id="selectedValue"></strong></div>
        <div class="detail-block">
          <h3>直接公式</h3>
          <div id="directFormulaList"></div>
        </div>
        <div class="detail-block">
          <div class="tree-heading">
            <h3>完整计算树</h3>
            <div class="tree-controls" aria-label="计算树视图控制">
              <button type="button" id="treeZoomOut" class="icon-button" title="缩小计算树" aria-label="缩小计算树">−</button>
              <output id="treeZoomLevel" class="zoom-level" aria-live="polite">100%</output>
              <button type="button" id="treeZoomIn" class="icon-button" title="放大计算树" aria-label="放大计算树">+</button>
              <button type="button" id="treeResetView" class="icon-button" title="复位计算树视图" aria-label="复位计算树视图">↺</button>
              <button type="button" id="treeExpandMore" class="icon-button" title="展开更多计算层级" aria-label="展开更多计算层级">⇣</button>
            </div>
          </div>
          <div id="calculationTreeViewport" class="tree-viewport" tabindex="0" aria-label="完整计算树，可拖动或使用 W A S D 键移动">
            <div id="calculationTree" class="tree-canvas"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
/* expression.js */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  root.EMLExpression = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const TYPES = Object.freeze({
    CONSTANT: "constant",
    INTEGER: "integer",
    NEG: "neg",
    ADD: "add",
    SUB: "sub",
    MUL: "mul",
    DIV: "div",
    POW: "pow",
    LN: "ln",
    SQRT: "sqrt",
    SIN: "sin",
  });

  const constant = (name) => ({ type: TYPES.CONSTANT, name });
  const integer = (value) => ({ type: TYPES.INTEGER, value: Number(value) });
  const neg = (child) => ({ type: TYPES.NEG, child });
  const add = (left, right) => ({ type: TYPES.ADD, left, right });
  const sub = (left, right) => ({ type: TYPES.SUB, left, right });
  const mul = (left, right) => ({ type: TYPES.MUL, left, right });
  const div = (numerator, denominator) => ({ type: TYPES.DIV, numerator, denominator });
  const pow = (base, exponent) => ({ type: TYPES.POW, base, exponent });
  const ln = (argument) => ({ type: TYPES.LN, argument });
  const sqrt = (argument) => ({ type: TYPES.SQRT, argument });
  const sin = (argument) => ({ type: TYPES.SIN, argument });

  const ONE = integer(1);
  const ZERO = integer(0);
  const E = constant("e");
  const PI = constant("pi");
  const I = constant("i");
  const MAX_EXPRESSION_DEPTH = 64;
  const MAX_EXPRESSION_NODES = 2000;
  const ALLOWED_CONSTANTS = new Set(["e", "pi", "i"]);

  function canonicalKey(expression) {
    switch (expression.type) {
      case TYPES.CONSTANT:
        return `const:${expression.name}`;
      case TYPES.INTEGER:
        return `int:${expression.value}`;
      case TYPES.NEG:
        return `neg(${canonicalKey(expression.child)})`;
      case TYPES.ADD: {
        const keys = [canonicalKey(expression.left), canonicalKey(expression.right)].sort();
        return `add(${keys[0]},${keys[1]})`;
      }
      case TYPES.SUB:
        return `sub(${canonicalKey(expression.left)},${canonicalKey(expression.right)})`;
      case TYPES.MUL: {
        const keys = [canonicalKey(expression.left), canonicalKey(expression.right)].sort();
        return `mul(${keys[0]},${keys[1]})`;
      }
      case TYPES.DIV:
        return `div(${canonicalKey(expression.numerator)},${canonicalKey(expression.denominator)})`;
      case TYPES.POW:
        return `pow(${canonicalKey(expression.base)},${canonicalKey(expression.exponent)})`;
      case TYPES.LN:
        return `ln(${canonicalKey(expression.argument)})`;
      case TYPES.SQRT:
        return `sqrt(${canonicalKey(expression.argument)})`;
      case TYPES.SIN:
        return `sin(${canonicalKey(expression.argument)})`;
      default:
        throw new Error(`未知表达式类型：${expression.type}`);
    }
  }

  const isSame = (left, right) => canonicalKey(left) === canonicalKey(right);
  const isInteger = (expression, value) => expression.type === TYPES.INTEGER && expression.value === value;
  const isConstant = (expression, name) => expression.type === TYPES.CONSTANT && expression.name === name;

  function precedence(expression) {
    if ([TYPES.ADD, TYPES.SUB].includes(expression.type)) return 1;
    if ([TYPES.MUL, TYPES.DIV].includes(expression.type)) return 2;
    if (expression.type === TYPES.POW) return 3;
    return 4;
  }

  function render(expression, parentPrecedence = 0) {
    const ownPrecedence = precedence(expression);
    let text;
    switch (expression.type) {
      case TYPES.CONSTANT:
        text = expression.name === "pi" ? "π" : expression.name;
        break;
      case TYPES.INTEGER:
        text = String(expression.value);
        break;
      case TYPES.NEG:
        if (expression.child.type === TYPES.NEG) {
          text = `-(${render(expression.child)})`;
        } else if (
          expression.child.type === TYPES.MUL &&
          [expression.child.left, expression.child.right].every((part) =>
            [TYPES.CONSTANT, TYPES.INTEGER].includes(part.type)
          )
        ) {
          text = `-${render(expression.child, 2)}`;
        } else {
          text = `-${render(expression.child, ownPrecedence)}`;
        }
        break;
      case TYPES.ADD:
        text = `${render(expression.left, ownPrecedence)} + ${render(expression.right, ownPrecedence)}`;
        break;
      case TYPES.SUB:
        text = `${render(expression.left, ownPrecedence)} - ${render(expression.right, ownPrecedence + 1)}`;
        break;
      case TYPES.MUL: {
        const leftText = render(expression.left, ownPrecedence);
        const rightText = render(expression.right, ownPrecedence);
        const compact = [expression.left, expression.right].every((part) =>
          [TYPES.CONSTANT, TYPES.INTEGER].includes(part.type)
        );
        text = compact ? `${leftText}${rightText}` : `${leftText} × ${rightText}`;
        break;
      }
      case TYPES.DIV:
        text = `${render(expression.numerator, ownPrecedence)} / ${render(expression.denominator, ownPrecedence + 1)}`;
        break;
      case TYPES.POW: {
        const baseText = render(expression.base, ownPrecedence);
        const exponentText = render(expression.exponent);
        text = `${baseText}^(${exponentText})`;
        break;
      }
      case TYPES.LN:
        text = `ln(${render(expression.argument)})`;
        break;
      case TYPES.SQRT:
        text = `√(${render(expression.argument)})`;
        break;
      case TYPES.SIN:
        text = `sin(${render(expression.argument)})`;
        break;
      default:
        throw new Error(`未知表达式类型：${expression.type}`);
    }
    return ownPrecedence < parentPrecedence ? `(${text})` : text;
  }

  function approximate(expression) {
    const make = (re, im = 0) => ({ re, im });
    const addComplex = (a, b) => make(a.re + b.re, a.im + b.im);
    const subComplex = (a, b) => make(a.re - b.re, a.im - b.im);
    const mulComplex = (a, b) => make(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
    const divComplex = (a, b) => {
      const denominator = b.re * b.re + b.im * b.im;
      if (denominator === 0) return null;
      return make(
        (a.re * b.re + a.im * b.im) / denominator,
        (a.im * b.re - a.re * b.im) / denominator
      );
    };
    const expComplex = (z) => {
      const scale = Math.exp(z.re);
      return make(scale * Math.cos(z.im), scale * Math.sin(z.im));
    };
    const logComplex = (z) => {
      const magnitudeSquared = z.re * z.re + z.im * z.im;
      if (magnitudeSquared === 0) return null;
      return make(0.5 * Math.log(magnitudeSquared), Math.atan2(z.im, z.re));
    };

    switch (expression.type) {
      case TYPES.CONSTANT:
        if (expression.name === "e") return make(Math.E);
        if (expression.name === "pi") return make(Math.PI);
        if (expression.name === "i") return make(0, 1);
        return null;
      case TYPES.INTEGER:
        return make(expression.value);
      case TYPES.NEG: {
        const value = approximate(expression.child);
        return value ? make(-value.re, -value.im) : null;
      }
      case TYPES.ADD: {
        const left = approximate(expression.left);
        const right = approximate(expression.right);
        return left && right ? addComplex(left, right) : null;
      }
      case TYPES.SUB: {
        const left = approximate(expression.left);
        const right = approximate(expression.right);
        return left && right ? subComplex(left, right) : null;
      }
      case TYPES.MUL: {
        const left = approximate(expression.left);
        const right = approximate(expression.right);
        return left && right ? mulComplex(left, right) : null;
      }
      case TYPES.DIV: {
        const numerator = approximate(expression.numerator);
        const denominator = approximate(expression.denominator);
        return numerator && denominator ? divComplex(numerator, denominator) : null;
      }
      case TYPES.POW: {
        const base = approximate(expression.base);
        const exponent = approximate(expression.exponent);
        if (!base || !exponent) return null;
        if (Math.abs(base.re - Math.E) < 1e-12 && Math.abs(base.im) < 1e-12) return expComplex(exponent);
        const logBase = logComplex(base);
        return logBase ? expComplex(mulComplex(exponent, logBase)) : null;
      }
      case TYPES.LN: {
        const argument = approximate(expression.argument);
        return argument ? logComplex(argument) : null;
      }
      case TYPES.SQRT: {
        const argument = approximate(expression.argument);
        if (!argument) return null;
        const magnitude = Math.hypot(argument.re, argument.im);
        return make(
          Math.sqrt((magnitude + argument.re) / 2),
          Math.sign(argument.im || 1) * Math.sqrt(Math.max(0, (magnitude - argument.re) / 2))
        );
      }
      case TYPES.SIN: {
        const argument = approximate(expression.argument);
        return argument
          ? make(Math.sin(argument.re) * Math.cosh(argument.im), Math.cos(argument.re) * Math.sinh(argument.im))
          : null;
      }
      default:
        return null;
    }
  }

  function validateExpression(expression, options) {
    const maxDepth = options?.maxDepth ?? MAX_EXPRESSION_DEPTH;
    const maxNodes = options?.maxNodes ?? MAX_EXPRESSION_NODES;
    const active = new Set();
    let nodeCount = 0;

    function visit(node, depth) {
      if (!node || typeof node !== "object" || Array.isArray(node)) return false;
      if (depth > maxDepth || nodeCount >= maxNodes || active.has(node)) return false;
      nodeCount += 1;
      active.add(node);
      let valid = false;
      switch (node.type) {
        case TYPES.CONSTANT:
          valid = ALLOWED_CONSTANTS.has(node.name);
          break;
        case TYPES.INTEGER:
          valid = typeof node.value === "number" && Number.isSafeInteger(node.value);
          break;
        case TYPES.NEG:
          valid = visit(node.child, depth + 1);
          break;
        case TYPES.ADD:
        case TYPES.SUB:
        case TYPES.MUL:
          valid = visit(node.left, depth + 1) && visit(node.right, depth + 1);
          break;
        case TYPES.DIV:
          valid = visit(node.numerator, depth + 1) && visit(node.denominator, depth + 1);
          break;

    const { viewport, canvas, zoomOut, zoomIn, zoomLevel, resetButton, expandMore, onExpandMore } = options;
    let view = { ...ViewportModel.reset(), valueId: null };
    let pointer = null;

    function dimensions() {
      return {
        viewportWidth: viewport.clientWidth,
        viewportHeight: viewport.clientHeight,
        contentWidth: canvas.scrollWidth,
        contentHeight: canvas.scrollHeight,
      };
    }

    function apply() {
      const next = ViewportModel.clampPosition(view, dimensions());
      view = { ...next, valueId: view.valueId };
      canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
      zoomLevel.textContent = `${Math.round(view.scale * 100)}%`;
      zoomOut.disabled = view.scale <= ViewportModel.MIN_SCALE;
      zoomIn.disabled = view.scale >= ViewportModel.MAX_SCALE;
    }

    function zoom(delta) {
      view = {
        ...ViewportModel.zoomAt(
          view,
          view.scale + delta,
          { x: viewport.clientWidth / 2, y: viewport.clientHeight / 2 },
          dimensions()

        valueId: view.valueId,
      };
      apply();
    }

    function pan(deltaX, deltaY) {
      view = { ...ViewportModel.pan(view, deltaX, deltaY, dimensions()), valueId: view.valueId };
      apply();
    }

    function reset(valueId = view.valueId) {
      view = { ...ViewportModel.reset(), valueId };
      apply();
    }

    zoomOut.addEventListener("click", () => zoom(-ViewportModel.SCALE_STEP));
    zoomIn.addEventListener("click", () => zoom(ViewportModel.SCALE_STEP));
    resetButton.addEventListener("click", () => reset());
    expandMore.addEventListener("click", onExpandMore);

    viewport.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || event.target.closest("summary, button, a, input")) return;
      pointer = { pointerId: event.pointerId, lastX: event.clientX, lastY: event.clientY };
      viewport.setPointerCapture(event.pointerId);
      viewport.focus();

    viewport.addEventListener("pointermove", (event) => {
      if (!pointer || pointer.pointerId !== event.pointerId) return;
      event.preventDefault();
      pan(event.clientX - pointer.lastX, event.clientY - pointer.lastY);
      pointer.lastX = event.clientX;
      pointer.lastY = event.clientY;
    });
    const stopPointer = (event) => {
      if (pointer && pointer.pointerId === event.pointerId) pointer = null;
    };
    viewport.addEventListener("pointerup", stopPointer);
    viewport.addEventListener("pointercancel", stopPointer);

        a: [ViewportModel.PAN_STEP, 0],
        s: [0, -ViewportModel.PAN_STEP],
        d: [-ViewportModel.PAN_STEP, 0],

(function (root) {
  "use strict";

  const Expr = root.EMLExpression;
  const Evaluator = root.EMLEvaluator;
  const Store = root.EMLValueStore;
  const Persistence = root.EMLPersistence;
  const TreeController = root.EMLTreeController;

  const elements = {
    slotX: document.getElementById("slotX"),
    slotY: document.getElementById("slotY"),
    result: document.getElementById("resultOutput"),
    add: document.getElementById("addButton"),
    directPreview: document.getElementById("directPreview"),
    notice: document.getElementById("notice"),
    valueList: document.getElementById("valueList"),
    valueCount: document.getElementById("valueCount"),
    save: document.getElementById("saveButton"),
    import: document.getElementById("importButton"),
    importFile: document.getElementById("importFile"),
    clear: document.getElementById("clearButton"),
    detailsEmpty: document.getElementById("detailsEmpty"),
    detailsContent: document.getElementById("detailsContent"),
    selectedValue: document.getElementById("selectedValue"),
    directFormulaList: document.getElementById("directFormulaList"),
    calculationTreeViewport: document.getElementById("calculationTreeViewport"),
    calculationTree: document.getElementById("calculationTree"),
    treeZoomOut: document.getElementById("treeZoomOut"),
    treeZoomIn: document.getElementById("treeZoomIn"),
    treeZoomLevel: document.getElementById("treeZoomLevel"),
    treeResetView: document.getElementById("treeResetView"),
    treeExpandMore: document.getElementById("treeExpandMore"),
  };

  let state = restoreState();
  let preview = null;
  let pointerDrag = null;
  let suppressValueClick = false;
  let treeDepth = Store.DEFAULT_TREE_DEPTH;
  const treeController = TreeController.create({
    viewport: elements.calculationTreeViewport,
    canvas: elements.calculationTree,
    zoomOut: elements.treeZoomOut,
    zoomIn: elements.treeZoomIn,
    zoomLevel: elements.treeZoomLevel,
    resetButton: elements.treeResetView,
    expandMore: elements.treeExpandMore,
    onExpandMore: () => {
      treeDepth = Math.min(Store.MAX_TREE_DEPTH, treeDepth + Store.DEFAULT_TREE_DEPTH);
      renderDetails();
    },
  });

  function restoreState() {
    try {
      const restored = Persistence.loadFromCache(localStorage);
      if (restored.ok) return restored.state;
    } catch {
      // A disabled cache should not prevent the calculator from starting.
    }
    return Store.createInitialState();
  }

  function persistState() {
    try {
      Persistence.saveToCache(localStorage, state);
      return true;
    } catch {
      showNotice("无法写入浏览器缓存，请使用“保存列表”备份。", true);
      return false;
    }
  }

  function showNotice(message, isError = false) {
    elements.notice.textContent = message || "";
    elements.notice.classList.toggle("error", isError);
  }

  function currentValue(valueId) {
    return valueId ? state.values[valueId] : null;
  }

  function recomputePreview() {
    const x = currentValue(state.inputXId);
    const y = currentValue(state.inputYId);
    preview = x && y ? Evaluator.evaluateEML(x.canonicalExpression, y.canonicalExpression) : null;
  }

  function renderSlot(element, value, placeholder) {
    element.textContent = value ? value.displayText : placeholder;
    element.classList.toggle("filled", Boolean(value));
    element.title = value ? value.displayText : `${placeholder} 输入位置`;
  }

  function renderCalculator() {
    renderSlot(elements.slotX, currentValue(state.inputXId), "x");
    renderSlot(elements.slotY, currentValue(state.inputYId), "y");
    elements.result.classList.toggle("error", Boolean(preview && (!preview.ok || preview.limitReached)));

    if (!preview) {
      elements.result.textContent = "?";
      elements.directPreview.textContent = "等待 x、y";
      elements.add.disabled = true;
      return;
    }

    if (!preview.ok) {
      elements.result.textContent = "未定义";
      elements.directPreview.textContent = preview.error;
      elements.add.disabled = true;
      return;
    }

    if (preview.limitReached) {
      elements.result.textContent = preview.displayText;
      elements.directPreview.textContent = "化简达到安全上限，当前结果尚不能添加。";
      elements.add.disabled = true;
      return;
    }

    elements.result.textContent = preview.displayText;
    elements.directPreview.textContent = preview.directFormula;
    elements.add.disabled = false;
  }

  function makeDeleteButton(valueId) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "delete-button";
    button.textContent = "×";
    button.title = "删除该数值";
    button.setAttribute("aria-label", "删除该数值");
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      const result = Store.deleteValue(state, valueId);
      if (result.status === "referenced") {
        showNotice("该数值已被其他公式引用，不能删除。", true);
        return;
      }
      if (result.status !== "deleted") return;
      state = result.state;
      recomputePreview();
      persistState();
      showNotice("已删除数值。", false);
      render();
    });
    return button;
  }

  function renderValues() {
    elements.valueList.replaceChildren();
    elements.valueCount.textContent = `${state.valueOrder.length} 个数值`;

    for (const valueId of state.valueOrder) {
      const value = state.values[valueId];
      if (!value) continue;
      const item = document.createElement("div");
      item.className = "value-item";
      item.classList.toggle("protected", Boolean(value.protected));
      item.classList.toggle("selected", state.selectedValueId === valueId);
      item.dataset.valueId = valueId;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "value-button";
      button.textContent = value.displayText;
      button.title = value.protected ? `${value.displayText}（初始值，不可删除）` : value.displayText;
      button.draggable = false;
      button.setAttribute("aria-pressed", String(state.selectedValueId === valueId));
      button.addEventListener("click", () => {
        if (suppressValueClick) {
          suppressValueClick = false;
          return;
        }
        state = Store.selectValue(state, valueId);
        persistState();
        showNotice("");
        render();
      });
      button.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        pointerDrag = { valueId, startX: event.clientX, startY: event.clientY, active: false, pointerId: event.pointerId };
        button.setPointerCapture(event.pointerId);
      });
      button.addEventListener("pointermove", (event) => {
        if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
        const distance = Math.hypot(event.clientX - pointerDrag.startX, event.clientY - pointerDrag.startY);
        if (distance > 6) pointerDrag.active = true;
        if (!pointerDrag.active) return;
        event.preventDefault();
        document.querySelectorAll(".input-slot").forEach((slot) => slot.classList.remove("drag-over"));
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".input-slot");
        if (target) target.classList.add("drag-over");
      });
      button.addEventListener("pointerup", (event) => {
        if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
        const drag = pointerDrag;
        pointerDrag = null;
        document.querySelectorAll(".input-slot").forEach((slot) => slot.classList.remove("drag-over"));
        if (!drag.active) return;
        suppressValueClick = true;
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".input-slot");
        if (target) assignInput(target.dataset.slot, drag.valueId);
      });

      item.appendChild(button);
      if (!value.protected) item.appendChild(makeDeleteButton(valueId));
      elements.valueList.appendChild(item);
    }
  }

  function appendValueBranch(container, label, node) {
    const item = document.createElement("li");
    item.className = "tree-value";
    const heading = document.createElement("span");
    heading.className = "tree-label";
    heading.textContent = `${label}: ${node.label || "未知"}${node.initial ? "（初始值）" : ""}`;
    item.appendChild(heading);

    if (node.type === "cycle") {
      item.append("（检测到循环，已停止展开）");
    } else if (node.type === "deferred") {
      item.append(node.reason === "node-limit" ? "（已达到节点显示上限）" : "（还有更早的来源）");
    } else if (node.derivations && node.derivations.length) {
      node.derivations.forEach((derivation) => item.appendChild(renderDerivation(derivation)));
    }
    container.appendChild(item);
  }

  function renderDerivation(derivation) {
    const details = document.createElement("details");
    details.className = "tree-derivation";
    details.open = true;
    const summary = document.createElement("summary");
    summary.textContent = derivation.directFormula || "公式数据缺失";
    details.appendChild(summary);

    if (derivation.rewriteSteps && derivation.rewriteSteps.length) {
      const steps = document.createElement("ol");
      steps.className = "rewrite-steps";
      for (const step of derivation.rewriteSteps) {
        const item = document.createElement("li");
        item.textContent = `${step.before} → ${step.after}`;
        steps.appendChild(item);
      }
      details.appendChild(steps);
    }

    const inputs = document.createElement("ul");
    inputs.className = "tree-inputs";
    appendValueBranch(inputs, "x", derivation.x);
    appendValueBranch(inputs, "y", derivation.y);
    details.appendChild(inputs);
    return details;
  }

  function renderDetails() {
    const details = Store.getDetails(state, state.selectedValueId, {
      maxDepth: treeDepth,
      maxNodes: Store.MAX_TREE_NODES,
    });
    if (treeController.ensureValue(state.selectedValueId)) {
      treeDepth = Store.DEFAULT_TREE_DEPTH;
      return renderDetails();
    }
    elements.detailsEmpty.hidden = Boolean(details);
    elements.detailsContent.hidden = !details;
    elements.directFormulaList.replaceChildren();
    elements.calculationTree.replaceChildren();
    treeController.setExpandable(false, false);
    if (!details) return;

    elements.selectedValue.textContent = details.value.displayText;
    if (details.directFormulas.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-formulas";
      empty.textContent = details.value.protected ? "初始值，没有上游公式。" : "没有公式来源。";
      elements.directFormulaList.appendChild(empty);
    } else {
      for (const formula of details.directFormulas) {
        const row = document.createElement("div");
        row.className = "formula-entry";
        row.textContent = formula;
        elements.directFormulaList.appendChild(row);
      }
    }

    if (details.tree.derivations.length === 0) {
      const root = document.createElement("div");
      root.className = "empty-formulas";
      root.textContent = `${details.value.displayText}（初始值）`;
      elements.calculationTree.appendChild(root);
    } else {
      details.tree.derivations.forEach((derivation) => {

      });

  function render() {
    renderCalculator();
    renderValues();
    renderDetails();
  }

  function assignInput(slotName, valueId) {
    if (!state.values[valueId]) {
      showNotice("拖入的数值无效。", true);
      return;
    }
    state = Store.setInput(state, slotName, valueId);
    recomputePreview();
    persistState();
    showNotice("");
    render();
  }

  function bindSlot(element, slotName) {

      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
      element.classList.add("drag-over");
    });
    element.addEventListener("dragleave", () => element.classList.remove("drag-over"));
    element.addEventListener("drop", (event) => {
      event.preventDefault();
      element.classList.remove("drag-over");
      const valueId = event.dataTransfer.getData("application/x-eml-value") || event.dataTransfer.getData("text/plain");
      assignInput(slotName, valueId);
    });
    element.addEventListener("click", () => {
      if (!state.selectedValueId) {
        showNotice("请先选择数值栏中的一个数值。", true);
        return;
      }
      assignInput(slotName, state.selectedValueId);
    });
  }

  bindSlot(elements.slotX, "x");
  bindSlot(elements.slotY, "y");

  elements.add.addEventListener("click", () => {
    if (!preview || !preview.ok || !state.inputXId || !state.inputYId) return;
    const result = Store.addEvaluation(state, preview, state.inputXId, state.inputYId);
    state = result.state;
    persistState();
    const messages = {
      "added-value": "已添加新数值和公式来源。",
      "added-formula": "数值已存在，已添加新的公式来源。",
      "duplicate-formula": "该数值和公式已经存在。",
    };
    showNotice(messages[result.status] || "无法添加当前结果。", result.status === "invalid");
    render();
  });

  elements.save.addEventListener("click", () => {
    const blob = new Blob([Persistence.serialize(state)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    elements.save.href = url;
    elements.save.download = "eml-workbench-v2.json";
    setTimeout(() => {
      URL.revokeObjectURL(url);
      elements.save.href = "#";
    }, 1000);
    persistState();
    showNotice("列表已保存到本地文件。", false);
  });

  elements.import.addEventListener("click", () => elements.importFile.click());
  elements.importFile.addEventListener("change", () => {
    const file = elements.importFile.files && elements.importFile.files[0];
    elements.importFile.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const restored = Persistence.deserialize(String(reader.result || ""));
      if (!restored.ok) {
        showNotice(`导入失败：${restored.error}。现有列表未改变。`, true);
        return;
      }
      state = restored.state;
      recomputePreview();
      persistState();
      showNotice("导入成功。", false);
      render();
    };
    reader.onerror = () => showNotice("导入失败：无法读取文件。现有列表未改变。", true);
    reader.readAsText(file, "utf-8");
  });

  elements.clear.addEventListener("click", () => {
    if (!window.confirm("清空所有非初始数值和公式？初始值 1 会保留。")) return;
    state = Store.clearNonInitial();
    preview = null;
    persistState();
    showNotice("已清空，初始值 1 已保留。", false);
    render();
  });

  recomputePreview();
  render();
  root.EMLApp = {
    getState: () => JSON.parse(JSON.stringify(state)),
    getPreview: () => preview ? JSON.parse(JSON.stringify(preview)) : null,
    getTreeView: treeController.getView,
  };
})(typeof globalThis !== "undefined" ? globalThis : this);

  </script>
