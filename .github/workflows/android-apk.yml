name: Android APK

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "android/**"
      - "scripts/sync-android-assets.mjs"
      - "dist/eml-workbench.html"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/sync-android-assets.mjs"
      - "dist/eml-workbench.html"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 同步网页资源到 assets
        run: node scripts/sync-android-assets.mjs

      - name: 校验同步结果
        run: node scripts/sync-android-assets.mjs --check

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 确保 Android SDK 就位
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: 记录环境（可见于 CI 注解）
        run: |
          java -version 2>&1 | head -3
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "::notice title=构建环境::java=$(java -version 2>&1 | head -1) | ANDROID_HOME=${ANDROID_HOME:-无} | platforms=$(ls "$SDK/platforms" 2>/dev/null | tr '\n' ',') | build-tools=$(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ',')"

      - name: 构建 APK
        id: build
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: 输出构建失败日志（可见于 CI 注解）
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle-build.log"
          if [ ! -f "$LOG" ]; then
            echo "::error title=构建失败且无日志::未生成 $LOG"
            exit 0
          fi
          ERRORS=$(grep -E '^e: ' "$LOG" | head -40 || true)
          if [ -z "$ERRORS" ]; then
            ERRORS=$(grep -iE 'error:|FAILURE|What went wrong|Could not' "$LOG" | head -40 || true)
          fi
          TAIL=$(printf '%s\n%s\n%s' "$ERRORS" "--- 末尾 8 行 ---" "$(tail -8 "$LOG")")
          ESC=$(printf '%s' "$TAIL" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Gradle 构建错误::${ESC}"

      - name: 校验 APK 内网页与 dist 一致（U03）
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk)
          unzip -o -q "$APK" "assets/eml-workbench.html" -d /tmp/apk-content
          cmp /tmp/apk-content/assets/eml-workbench.html dist/eml-workbench.html
          echo "APK 内网页与 dist 一致，共 $(wc -c < dist/eml-workbench.html) 字节"

      - name: 记录产物信息
        working-directory: android/app/build/outputs/apk/debug
        run: |
          ls -l
          sha256sum ./*.apk | tee apk-sha256.txt
          APK=$(ls ./*.apk | head -1)
          echo "::notice title=APK 产物::$(basename "$APK") | 大小 $(du -h "$APK" | cut -f1) | sha256 $(sha256sum "$APK" | cut -c1-16)"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: eml-calculator-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/apk-sha256.txt
          if-no-files-found: error

      - name: 上传构建报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: android/app/build/reports/**
          if-no-files-found: ignore
