name: Android APK

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "android/**"
      - "scripts/sync-android-assets.mjs"
      - "dist/eml-workbench.html"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/sync-android-assets.mjs"
      - "dist/eml-workbench.html"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 同步网页资源到 assets
        run: node scripts/sync-android-assets.mjs

      - name: 校验同步结果
        run: node scripts/sync-android-assets.mjs --check

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 构建 APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: 输出构建诊断与日志
        if: always()
        run: |
          {
            echo "## 构建诊断"
            echo ""
            echo "### 环境"
            echo '```'
            java -version 2>&1 | head -3
            echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "platforms: $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
            echo "build-tools: $(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"
            gradle --version 2>&1 | head -12
            echo '```'
            echo ""
            echo "### Gradle 日志（末尾 150 行）"
            echo '```'
            if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
              tail -150 "$RUNNER_TEMP/gradle-build.log"
            else
              echo "（未生成日志）"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 校验 APK 内网页与 dist 一致（U03）
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk)
          unzip -o -q "$APK" "assets/eml-workbench.html" -d /tmp/apk-content
          cmp /tmp/apk-content/assets/eml-workbench.html dist/eml-workbench.html
          echo "APK 内网页与 dist 一致，共 $(wc -c < dist/eml-workbench.html) 字节"

      - name: 记录产物信息
        working-directory: android/app/build/outputs/apk/debug
        run: |
          ls -l
          sha256sum ./*.apk | tee apk-sha256.txt

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: eml-calculator-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/apk-sha256.txt
          if-no-files-found: error

      - name: 上传构建报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: android/app/build/reports/**
          if-no-files-found: ignore
