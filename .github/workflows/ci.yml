name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 18 是 README 对外承诺的支持版本，不能因为「本地跑不到」就删矩阵
        # —— 它恰恰是唯一能暴露「测试文件误用 ESM 语法」的环境：
        # package.json 没有声明 "type"，.js 一律按 CommonJS 解析，而 Node 18
        # 不具备 20.19+/22 的模块自动探测能力，测试文件里写 `import` 会在
        # 18 上直接抛「Cannot use import statement outside a module」，
        # 本地 Node 22 却完全正常（2026-09-27 android-shell.test.js 即此坑）。
        # 凡只在 Node 22 上验证过的改动，都要想到这一行。
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 先构建：下面的 assets 同步依赖 dist 产物。
      - name: Build single-file bundle
        run: npm run build

      # android/app/src/main/assets/ 是构建产物、被 .gitignore 排除，CI 检出后并不存在；
      # 而测试里有一条断言「assets 与 dist 字节一致」。缺这一步时 CI 必然失败，
      # 且失败信息看起来像「测试本身坏了」，真实原因却是「少了一步生成」。
      # 本地开发时开发者自己 sync 过，所以这个坑只在 CI 暴露
      # —— 2026-09-11 起 CI 连续失败即由此而来。
      - name: Sync android assets
        run: node scripts/sync-android-assets.mjs

      - name: Run tests
        run: npm test

      - name: Verify dist artifact exists
        run: test -f dist/eml-workbench.html
